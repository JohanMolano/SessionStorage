<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/login.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Iniciar Sesión</h1>
        <p class="subtitulo">Ingrese sus credenciales</p>
        <nav>
            <a href="index.html">Volver al inicio</a>
        </nav>
    </header>

    <main>
        <section class="tarjeta">
            <h2>Inicio de Sesión</h2>
            <form id="login-form" class="formulario">
                <div class="campo">
                    <label for="username">Nombre de Usuario:</label>
                    <input type="text" id="username" placeholder="Ej:pepitoperez" required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseñna" required>
                </div>
                <button type="submit" class="btn">Iniciar Sesión</button>
            </form>
            <p id="mensaje-login" class="mensaje-error"></p>
        </section>
    </main>

    <footer class="pie">
        <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
